<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232B4ACB'/%3E%3Cpath d='M16 22h32v22H16zM16 28h32' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E">

<title>Carnet de comptes</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Carnet de comptes</h1>
      <div class="date" id="today"></div>
    </div>
    <span class="sync local" id="sync"><i></i><span>Ce navigateur</span></span>
  </header>
  <main id="view"></main>
</div>

<nav class="bar-nav" aria-label="Navigation">
  <div class="bar-in">
    <button class="tab" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Comptes</button>
    <button class="tab" data-tab="ops">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Opérations</button>
    <button class="tab" data-tab="recap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15.5 3.6A9 9 0 0 1 20.4 8.5H15.5z"/></svg>Récap</button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Statistiques</button>
    <button class="tab" data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>Plus</button>
    <button class="add" id="addBtn" aria-label="Ajouter une opération">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" hidden></div>

<script src="app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
